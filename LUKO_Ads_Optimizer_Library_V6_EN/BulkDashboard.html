<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h2 {
      color: #333;
      border-bottom: 3px solid #667eea;
      padding-bottom: 10px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .stat-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .recommendations {
      margin: 20px 0;
    }
    .rec-item {
      padding: 15px;
      margin: 10px 0;
      border-left: 4px solid #667eea;
      background: #f8f9fa;
      border-radius: 5px;
    }
    .rec-priority {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 10px;
    }
    .critical { background: #ff4444; color: white; }
    .high { background: #ff8844; color: white; }
    .medium { background: #ffaa44; color: white; }
    .low { background: #44aa44; color: white; }
    .action-buttons {
      margin-top: 30px;
      text-align: center;
    }
    button {
      padding: 12px 25px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .primary-btn {
      background: #667eea;
      color: white;
    }
    .primary-btn:hover {
      background: #5a67d8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎯 BULK Optimizer - Panel Kontrolny</h2>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value"><?= analysis.summary.totalTargets ?></div>
        <div class="stat-label">Targetów ogółem</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">€<?= analysis.summary.totalSpend.toFixed(0) ?></div>
        <div class="stat-label">Wydatki</div>
      </div>
      <div class="stat-card">
        <div class="stat-value"><?= ((analysis.summary.totalSpend / analysis.summary.totalSales) * 100).toFixed(1) ?>%</div>
        <div class="stat-label">ACOS</div>
      </div>
      <div class="stat-card">
        <div class="stat-value"><?= analysis.segments.zeroSales.length ?></div>
        <div class="stat-label">Bez sprzedaży</div>
      </div>
    </div>
    
    <div class="recommendations">
      <h3>💡 Rekomendacje</h3>
      <? for (const rec of analysis.recommendations.slice(0, 5)) { ?>
        <div class="rec-item">
          <span class="rec-priority <?= rec.priority.toLowerCase() ?>"><?= rec.priority ?></span>
          <?= rec.description ?>
        </div>
      <? } ?>
    </div>
    
    <div class="action-buttons">
      <button class="primary-btn" onclick="google.script.run.showBidAdjustmentDialog(); google.script.host.close();">
        📊 Optymalizuj stawki
      </button>
      <button class="primary-btn" onclick="google.script.run.pauseZeroSalesTargets(); google.script.host.close();">
        ⏸️ Pauzuj targety bez sprzedaży
      </button>
      <button class="primary-btn" onclick="google.script.run.exportBulkFile(); google.script.host.close();">
        📤 Eksportuj do Amazon
      </button>
    </div>
  </div>
</body>
</html>
