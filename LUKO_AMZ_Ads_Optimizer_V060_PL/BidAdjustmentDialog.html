<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      padding: 20px;
      background: #f5f5f5;
    }
    h3 { color: #333; margin-bottom: 20px; }
    .option { 
      margin: 15px 0; 
      padding: 15px; 
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .option:hover { 
      border-color: #4CAF50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .option.selected {
      background: #e8f5e9;
      border-color: #4CAF50;
    }
    input[type="number"] { 
      width: 100px; 
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 14px;
    }
    .target-group {
      margin: 20px 0;
      padding: 15px;
      background: #fff;
      border-radius: 5px;
    }
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 14px;
    }
    button { 
      padding: 12px 25px; 
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .apply-btn { 
      background: #4CAF50; 
      color: white;
    }
    .apply-btn:hover {
      background: #45a049;
    }
    .cancel-btn { 
      background: #f44336; 
      color: white;
    }
    .cancel-btn:hover {
      background: #da190b;
    }
    .info-box {
      background: #e3f2fd;
      padding: 10px;
      border-left: 3px solid #2196F3;
      margin: 15px 0;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h3>📊 Dostosuj stawki targetów</h3>
  
  <div class="info-box">
    💡 Wybierz typ zmiany stawki oraz grupę docelową
  </div>
  
  <div class="option" onclick="selectOption('percent_increase')">
    <input type="radio" name="changeType" value="percent_increase" id="percent_increase">
    <label for="percent_increase"><strong>Zwiększ o %</strong></label>
    <input type="number" id="percent_increase_value" min="1" max="900" value="15" onclick="event.stopPropagation()">%
    <div style="color: #666; font-size: 12px; margin-top: 5px;">
      Dla targetów z dobrym ACOS - zwiększ widoczność
    </div>
  </div>
  
  <div class="option" onclick="selectOption('percent_decrease')">
    <input type="radio" name="changeType" value="percent_decrease" id="percent_decrease">
    <label for="percent_decrease"><strong>Zmniejsz o %</strong></label>
    <input type="number" id="percent_decrease_value" min="1" max="90" value="20" onclick="event.stopPropagation()">%
    <div style="color: #666; font-size: 12px; margin-top: 5px;">
      Dla targetów z wysokim ACOS - ogranicz koszty
    </div>
  </div>
  
  <div class="option" onclick="selectOption('amount_increase')">
    <input type="radio" name="changeType" value="amount_increase" id="amount_increase">
    <label for="amount_increase"><strong>Zwiększ o €</strong></label>
    <input type="number" id="amount_increase_value" min="0.01" step="0.01" value="0.10" onclick="event.stopPropagation()">€
    <div style="color: #666; font-size: 12px; margin-top: 5px;">
      Precyzyjne dostosowanie stawki
    </div>
  </div>
  
  <div class="option" onclick="selectOption('set_bid')">
    <input type="radio" name="changeType" value="set_bid" id="set_bid">
    <label for="set_bid"><strong>Ustaw na €</strong></label>
    <input type="number" id="set_bid_value" min="0.02" step="0.01" value="0.50" onclick="event.stopPropagation()">€
    <div style="color: #666; font-size: 12px; margin-top: 5px;">
      Ustaw jednakową stawkę dla grupy
    </div>
  </div>
  
  <div class="target-group">
    <h4>🎯 Zastosuj do:</h4>
    <select id="targetGroup">
      <option value="selected">Tylko zaznaczone wiersze</option>
      <option value="loss">Targety ze stratą (ACOS > break even)</option>
      <option value="profit">Targety zyskowne (ACOS < break even)</option>
      <option value="zero">Targety bez sprzedaży</option>
      <option value="all">Wszystkie targety</option>
    </select>
  </div>
  
  <div style="text-align: center; margin-top: 30px;">
    <button class="apply-btn" onclick="applyChanges()">✅ Zastosuj zmiany</button>
    <button class="cancel-btn" onclick="google.script.host.close()">❌ Anuluj</button>
  </div>
  
  <script>
    function selectOption(type) {
      document.getElementById(type).checked = true;
      
      // Usuń klasę selected ze wszystkich
      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      // Dodaj do wybranego
      event.currentTarget.classList.add('selected');
    }
    
    function applyChanges() {
      const changeType = document.querySelector('input[name="changeType"]:checked');
      
      if (!changeType) {
        alert('Wybierz typ zmiany!');
        return;
      }
      
      const targetGroup = document.getElementById('targetGroup').value;
      let value = 0;
      
      switch(changeType.value) {
        case 'percent_increase':
          value = document.getElementById('percent_increase_value').value;
          break;
        case 'percent_decrease':
          value = document.getElementById('percent_decrease_value').value;
          break;
        case 'amount_increase':
          value = document.getElementById('amount_increase_value').value;
          break;
        case 'set_bid':
          value = document.getElementById('set_bid_value').value;
          break;
      }
      
      // Wyślij do GAS
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            alert('✅ ' + result.message);
            google.script.host.close();
          } else {
            alert('❌ ' + result.message);
          }
        })
        .withFailureHandler(function(error) {
          alert('Błąd: ' + error);
        })
        .applyBidChanges(changeType.value, value, targetGroup);
    }
  </script>
</body>
</html>
